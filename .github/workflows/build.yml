name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform files if missing
        run: |
          if [ ! -d android ]; then
            cp lib/main.dart /tmp/main.dart.bak
            flutter create --platforms=android --project-name klencod_game --org com.klencod .
            cp /tmp/main.dart.bak lib/main.dart
            rm -rf test
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: klencod-game-apk
          path: build/app/outputs/flutter-apk/app-release.apk
